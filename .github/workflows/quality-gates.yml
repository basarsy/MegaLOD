# Required GitHub checks for protected branches (Settings → Branches):
# enable "RDF validation" + "Quality gates" workflow as required status checks,
# or select the individual jobs you want to block merges (PHPStan, PHPUnit, etc.).

name: Quality gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint-addtriplestore:
    name: PHP syntax (AddTriplestore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint module PHP files
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            php -l "$f"
          done < <(find software/omeka-s/modules/AddTriplestore -name '*.php' -print0)

  composer-audit-omeka:
    name: Composer audit (Omeka S)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/omeka-s
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          # Composer ≥2.8 provides composer audit --abandoned=report (omit on 2.7.x abandoned-only exit failures).
          tools: composer:2.8.12
          coverage: none

      # Fail only on security advisories; abandoned packages (Omeka/Laminas) are reported without failing exit.
      - name: composer audit (locked dependencies)
        run: composer audit --locked --no-dev --abandoned=report --format=json

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  phpunit-addtriplestore:
    name: PHPUnit + PHPStan (AddTriplestore, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    defaults:
      run:
        working-directory: software/omeka-s
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, phpstan:2.1.32
          coverage: none

      - name: Composer install (dev for PHPUnit)
        run: composer install --no-interaction --ignore-platform-reqs

      - name: OmekaItemPayloadSupport sanity script
        run: php modules/AddTriplestore/test/omeka_item_payload_support_test.php

      - name: PHPUnit module tests
        run: ./vendor/bin/phpunit -c modules/AddTriplestore/phpunit.xml

      - name: PHPStan AddTriplestore (Service + Controller)
        run: phpstan analyse --memory-limit=512M -c modules/AddTriplestore/phpstan.neon.dist
